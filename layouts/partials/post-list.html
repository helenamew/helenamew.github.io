<ul class="post-list">
  {{ range . }}
    <li>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
      {{ with .Summary }}<p class="post-summary">{{ . | plainify | htmlUnescape | truncate 220 }}</p>{{ end }}
    </li>
  {{ else }}
    <li class="post-empty">Nothing here yet.</li>
  {{ end }}
</ul>
