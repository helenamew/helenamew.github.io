<meta charset="utf-8">
{{ $external := .Params.pdf | default .Params.original }}
{{ if and .IsPage $external (not .Content) }}
  {{/* Writing with no body has no page of its own: redirect to its external link */}}
  <meta http-equiv="refresh" content="0; url={{ $external }}">
{{ end }}
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
{{ if hugo.IsProduction }}
  <meta name="robots" content="index, follow">
{{ else }}
  <meta name="robots" content="noindex, nofollow">
{{ end }}

<link rel="preload" href="{{ "/fonts/syne-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "/css/site.css" | relURL }}">
<link rel="icon" href="{{ "/favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="icon" href="{{ "/favicon-32.png" | relURL }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relURL }}">

{{ with .OutputFormats.Get "RSS" }}
  <link href="{{ .RelPermalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" />
{{ end }}
