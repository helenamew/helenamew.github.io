{{ define "main" }}
<section class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  <ol class="entries">
    {{ range .Data.Terms.ByCount }}
      <li class="entry">
        <div class="entry-main">
          <a class="entry-title" href="{{ .Page.RelPermalink }}">#{{ .Page.Title }}</a>
          <p class="entry-meta">{{ .Count }} {{ cond (eq .Count 1) "piece" "pieces" }}</p>
        </div>
      </li>
    {{ else }}
      <li class="entry entry--empty">No tags yet.</li>
    {{ end }}
  </ol>
</section>
{{ end }}
