baseURL: https://helenamew.github.io/
languageCode: en-gb
title: Helena Ward

defaultContentLanguage: en

taxonomies:
  tag: tags

permalinks:
  writing: /writing/:filename/ # post address comes from its file name

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML (e.g. <sup>, <mark>) in posts

params:
  author: Helena Ward
  description: Helena Ward — philosophy PhD student at the University of Oxford.
  email: helena.ward@phil.ox.ac.uk

  # Buttons on the homepage and inner-page menu (colour = outline colour)
  homeButtons:
    - name: Research
      url: /research/
      colour: "#e27e35"
    - name: Writing
      url: /writing/
      colour: "#a93226"
    - name: CV
      url: /CV_07_10_2026.pdf
      download: Helena-Ward-CV.pdf # downloads the file under this name instead of opening a page
      colour: "#f2b13d"
